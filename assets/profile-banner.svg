<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">bbcdabao — From systems to interfaces</title>
  <desc id="desc">An animated connection between C/C++, Java and Vue, representing end-to-end software development.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101c32"/><stop offset="1" stop-color="#09121f"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#53dec4"/><stop offset="1" stop-color="#83a8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ca8cb" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .flow { stroke-dasharray: 7 19; animation: travel 8s linear infinite; }
    .halo { animation: breathe 5s ease-in-out infinite; }
    .second { animation-delay: -1.6s; }
    .third { animation-delay: -3.2s; }
    @keyframes travel { to { stroke-dashoffset: -208; } }
    @keyframes breathe { 0%,100% { opacity: .16; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .flow, .halo { animation: none; } }
  </style>
  <rect width="960" height="280" rx="20" fill="url(#background)"/>
  <rect width="960" height="280" rx="20" fill="url(#grid)"/>
  <path d="M40 39H81" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="96" y="44" fill="#a6b9d4" font-size="13" letter-spacing="3">CODE · BUILD · EXPLORE</text>
  <text x="40" y="107" fill="#f0f5ff" font-size="46" font-weight="700">bbcdabao</text>
  <text x="40" y="146" fill="#b5c6df" font-size="21">From systems to interfaces.</text>
  <text x="40" y="177" fill="#b5c6df" font-size="21">Building with curiosity.</text>
  <rect x="40" y="216" width="203" height="29" rx="14.5" fill="#152d3a" stroke="#294b59"/>
  <text x="141.5" y="236" text-anchor="middle" fill="#7de4d1" font-size="13">STAY CURIOUS. KEEP BUILDING.</text>
  <path d="M575 126H862" stroke="#293c55" stroke-width="2"/>
  <path class="flow" d="M575 126H862" stroke="url(#accent)" stroke-width="3" fill="none"/>
  <g fill="none" stroke="#63deca" stroke-width="2">
    <circle class="halo" cx="575" cy="126" r="43"/>
    <circle class="halo second" cx="718" cy="126" r="43"/>
    <circle class="halo third" cx="862" cy="126" r="43"/>
  </g>
  <g fill="#132438" stroke="#37516c">
    <circle cx="575" cy="126" r="33"/>
    <circle cx="718" cy="126" r="33"/>
    <circle cx="862" cy="126" r="33"/>
  </g>
  <g text-anchor="middle" fill="#edf6ff" font-size="16" font-weight="600">
    <text x="575" y="132">C/C++</text>
    <text x="718" y="132">Java</text>
    <text x="862" y="132">Vue</text>
  </g>
  <g text-anchor="middle" fill="#9db2ce" font-size="13">
    <text x="575" y="194">SYSTEMS</text>
    <text x="718" y="194">SERVICES</text>
    <text x="862" y="194">INTERFACES</text>
  </g>
  <path d="M533 230H904" stroke="#263a52"/>
  <text x="718" y="252" text-anchor="middle" fill="#8ea6c6" font-size="12" letter-spacing="1.5">OPEN SOURCE · FULL STACK</text>
</svg>
